<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace Init Feed</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="panel">
            <p class="eyebrow">ALT:V Marketplace Feed</p>
            <h1>marketplace.client.initResult</h1>
            <p class="subline">Страница открывается внутри игрового WebView и получает данные напрямую из executor-скрипта.</p>

            <div class="feed-meta">
                <span id="feed-source">Источник: in-game bridge</span>
                <span id="entry-count">0 записей</span>
            </div>

            <div class="status-grid">
                <div class="status-card">
                    <span class="status-label">Последнее обновление</span>
                    <strong id="last-updated">-</strong>
                </div>
                <div class="status-card">
                    <span class="status-label">Статус</span>
                    <strong id="sync-status">Ожидание данных</strong>
                </div>
            </div>

            <div id="empty-state" class="empty-state">Нет данных</div>

            <div class="table-wrap" id="table-wrap" hidden>
                <table class="feed-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Item ID</th>
                            <th>Total Quantity</th>
                            <th>Starting Bet</th>
                        </tr>
                    </thead>
                    <tbody id="feed-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>

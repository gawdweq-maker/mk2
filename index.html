<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace Init Feed</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="panel">
            <p class="eyebrow">ALT:V Marketplace Feed</p>
            <h1>marketplace.client.initResult</h1>
            <p class="subline">Страница получает данные из URL hash в компактном формате <code>#v=2&event=...&data=...</code>. Executor формирует готовую ссылку для открытия в браузере.</p>

            <div class="feed-meta">
                <span id="feed-source">Источник: URL hash</span>
                <span id="entry-count">0 записей</span>
            </div>

            <div class="control-panel">
                <textarea id="payload-input" class="payload-input" spellcheck="false" placeholder="Вставь сюда compact payload вида 9,1,11111;3,102,2319 если хочешь проверить отображение вручную."></textarea>
                <div class="control-actions">
                    <button id="apply-json" class="control-button" type="button">Применить payload</button>
                    <button id="clear-json" class="control-button control-button-secondary" type="button">Очистить</button>
                </div>
            </div>

            <div id="empty-state" class="empty-state">Нет данных</div>

            <div class="table-wrap" id="table-wrap" hidden>
                <table class="feed-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Item ID</th>
                            <th>Total Quantity</th>
                            <th>Starting Bet</th>
                        </tr>
                    </thead>
                    <tbody id="feed-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
